<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Towny Rehber Kitapçığı</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#111318;color:#eee;display:flex;min-height:100vh}
.sidebar{width:270px;background:#181b21;border-right:1px solid #30343d;padding:25px 15px;position:fixed;height:100vh;overflow-y:auto}
.logo{text-align:center;font-size:21px;font-weight:bold;margin-bottom:30px}.logo span{display:block;font-size:35px;margin-bottom:8px}
.menu-title{color:#888f9d;font-size:12px;margin:18px 10px 8px;text-transform:uppercase}
.menu button,.admin-btn{width:100%;padding:12px;margin-bottom:5px;border:none;border-radius:7px;background:transparent;color:#cfd3da;text-align:left;cursor:pointer;font-size:14px}
.menu button:hover,.admin-btn:hover{background:#252a33;color:#fff}.menu button.active{background:#303743;color:#fff}
.admin-btn{margin-top:20px;background:#252a33;text-align:center}
.content{margin-left:270px;width:calc(100% - 270px);padding:60px}.page{max-width:900px;margin:auto}
.welcome,.card{background:#181b21;border:1px solid #30343d;border-radius:12px}
.welcome{padding:45px;margin-bottom:25px}.card{padding:25px;margin-bottom:15px}
h1{font-size:38px;margin-bottom:15px}h2{font-size:28px;margin-bottom:18px}h3{margin:25px 0 10px}
p{color:#b9bec8;line-height:1.7;margin-bottom:15px}ul{margin-left:20px;color:#b9bec8;line-height:2}
.quote{border-left:4px solid #777f8d;padding:15px 20px;margin:20px 0;background:#20242b;color:#dfe2e7}
table{width:100%;border-collapse:collapse;margin:15px 0;color:#ddd}th,td{border:1px solid #3a3f49;padding:12px;text-align:left}th{background:#252a33}
code,.command{background:#0d0f13;padding:3px 7px;border-radius:5px;color:#ddd}.command{display:block;padding:15px;margin:15px 0;font-family:monospace}
footer{text-align:center;color:#666d78;margin-top:50px;padding-bottom:30px}
#adminPanel{display:none}.admin-grid{display:grid;gap:12px}.admin-input,.admin-textarea{width:100%;background:#0f1116;border:1px solid #3b414c;color:#eee;border-radius:7px;padding:11px;font-size:14px}
.admin-textarea{min-height:150px;resize:vertical}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.action{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;background:#303743;color:#fff}.action:hover{background:#3b4350}.danger{background:#542d32}.danger:hover{background:#6b363d}
.small{font-size:12px;color:#8f96a3;line-height:1.5}
.section-list{display:grid;gap:8px;margin-top:15px}.section-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#20242b;border:1px solid #30343d;padding:10px;border-radius:7px}.section-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.sidebar{width:210px}.content{margin-left:210px;width:calc(100% - 210px);padding:25px}h1{font-size:30px}}
</style>
<script>
const ADMIN_PASSWORD = "BPTrehberi26";

function openAdminPanel() {
    const password = prompt("⚙️ Yönetim Paneli\n\nŞifreyi girin:");
    if (password === ADMIN_PASSWORD) {
        showAdminPanelUnlocked();
    } else if (password !== null) {
        alert("❌ Şifre yanlış!");
    }
}
</script>

</head>
<body>
<aside class="sidebar">
<div class="logo"><span>📖</span>TOWNY REHBER</div>
<div class="menu-title">Kitapçık</div>
<div class="menu" id="menu"></div>
<button class="admin-btn" onclick="openAdminPanel()">⚙️ Yönetim Paneli</button>
</aside>

<main class="content">
<div class="page" id="site"></div>

<div class="page" id="adminPanel">
<div class="card">
<h2>⚙️ Yönetim Paneli</h2>
<p>Buradan kitapçığın bölümlerini kod açmadan düzenleyebilirsin.</p>
<p class="small">Not: Bu basit sürüm değişiklikleri bu tarayıcıda saklar. Gerçek ortak/admin sistemi değildir.</p>
</div>
<div class="card">
<h3>Yeni bölüm ekle</h3>
<div class="admin-grid">
<input id="newTitle" class="admin-input" placeholder="Bölüm adı">
<textarea id="newContent" class="admin-textarea" placeholder="Bölüm içeriği"></textarea>
</div>
<div class="admin-actions"><button class="action" onclick="addSection()">➕ Bölüm Ekle</button></div>
</div>
<div class="card">
<h3>Mevcut bölümler</h3>
<div id="sectionList" class="section-list"></div>
<div class="admin-actions">
<button class="action" onclick="resetData()">↩️ İlk haline döndür</button>
<button class="action" onclick="closeAdmin()">← Siteye dön</button>
</div>
</div>
</div>
<footer>Towny Rehber Ekibi • Rehber Kitapçığı</footer>
</main>

<script>
const defaultSections = [
{id:"ana",title:"🏠 Ana Sayfa",heading:"📖 Towny Rehber Kitapçığı",content:`<p>Towny Rehber Ekibi için hazırlanmış görev, davranış ve uygulama kılavuzu.</p><div class="quote">"Oyuncuya yardım et, taraf tutma, bilmediğini uydurma ve yetkini kişisel amaçlarla kullanma."</div>`},
{id:"gorev",title:"📌 Rehberlerin Görevi",heading:"📌 Rehberlerin Görevi",content:`<p>Rehberlerin temel görevi oyunculara Towny sistemini öğretmek ve yaşadıkları sorunlarda doğru şekilde yardımcı olmaktır.</p><h3>Temel görevler</h3><ul><li>Yeni oyunculara Towny sistemini anlatmak.</li><li>Town, Nation ve claim sistemlerini öğretmek.</li><li>Komutlar hakkında bilgi vermek.</li><li>Oyuncuların sorularını cevaplamak.</li><li>Gerekli durumlarda üst yetkiliye başvurmak.</li><li>Oyuncular arasında tarafsız kalmak.</li></ul>`},
{id:"davranis",title:"🤝 Davranış ve Tutum",heading:"🤝 Davranış ve Tutum",content:`<p>Rehberler bütün oyunculara karşı saygılı, sakin ve yardımsever davranmalıdır.</p><h3>Rehber:</h3><ul><li>Saygılı konuşmalıdır.</li><li>Oyuncuyu dinlemelidir.</li><li>Sabırlı olmalıdır.</li><li>Bilmediği konuyu araştırmalıdır.</li></ul><h3>Rehber yapmamalıdır:</h3><ul><li>Oyuncuyla tartışmamalıdır.</li><li>Oyuncuyu küçük düşürmemelidir.</li><li>Yetkisini tehdit amacıyla kullanmamalıdır.</li><li>Kişisel sebeplerle işlem yapmamalıdır.</li></ul>`},
{id:"tarafsiz",title:"⚖️ Tarafsızlık",heading:"⚖️ Tarafsızlık",content:`<p>Rehberler arkadaşları veya kendi Townları söz konusu olduğunda bile tarafsız kalmalıdır.</p><ul><li>Arkadaşına ayrıcalık tanıma.</li><li>Kanıt olmadan suçlama yapma.</li><li>Kişisel anlaşmazlıklarda yetkini kullanma.</li><li>Her iki tarafı da dinle.</li></ul>`},
{id:"iletisim",title:"💬 Oyuncu İletişimi",heading:"💬 Oyuncu İletişimi",content:`<p>Oyuncunun sorunu öncelikle tamamen anlaşılmalıdır. Ardından uygun çözüm anlatılmalıdır.</p><div class="quote">Bilmediğin bir konuda tahmin ederek cevap verme.</div>`},
{id:"ticket",title:"🎫 Ticket Üzerinde Davranış",heading:"🎫 Rehberin Ticket Üzerinde Davranışları",content:`<p>Ticket üzerinde rehber, yazdığı mesajlara ve üslubuna dikkat etmelidir.</p><ul><li>Oyuncuya karşı dikkatli, anlaşılır ve saygılı bir dil kullanmalıdır.</li><li>Bir oyuncuya çok kısa, başka bir oyuncuya gereksiz şekilde çok uzun cevap vererek keyfi farklılık oluşturmamalıdır.</li><li>Benzer durumdaki oyunculara mümkün olduğunca tutarlı ve eşit şekilde açıklama yapmalıdır.</li><li>Oyuncuların sorularını geçiştirmek yerine yeterli açıklama yapmalıdır.</li><li>Yeterli bilgi ve kanıt yoksa kesin karar vermemelidir.</li></ul>`},
{id:"ticket-sorular",title:"📝 Ticket İlk Sorular",heading:"📝 İlk Önce Sorulması Gereken Sorular",content:`<h3>Oyuncunun eşyası kaybolduysa ve geri istiyorsa:</h3><ol><li>Ölüm saati neydi?</li><li>Kaydı var mı?</li><li>Üzerinde hangi itemler vardı?</li></ol><h3>TP tuzağı / ticaret adı altında TP tuzağı iddiası varsa:</h3><ol start="4"><li>Tuzağa kendisi mi gitti, yoksa başka biri tarafından mı çekildi?</li></ol>`},
{id:"towny",title:"🏘️ Towny İşlemleri",heading:"🏘️ Towny İşlemleri",content:`<h3>Town</h3><p>Town kurma, oyuncu davet etme, claim ve izin sistemleri hakkında oyuncuya yardımcı ol.</p><h3>Nation</h3><p>Nation sistemi ve Townlar arasındaki ilişkiler hakkında bilgi ver.</p><h3>Outpost</h3><p>Outpost claim sistemi hakkında oyuncuya sunucunun belirlediği kurallar dahilinde bilgi ver.</p>`},
{id:"grief",title:"🚫 Grief",heading:"🚫 Grief",content:`<p>Başka bir oyuncunun yapısına veya eşyalarına kasıtlı olarak zarar verilmesi grief olarak değerlendirilebilir.</p><h3>Rehberin yapması gerekenler:</h3><ul><li>Şikâyeti dinle.</li><li>Konumu öğren.</li><li>Kanıt olup olmadığını sor.</li><li>Yetki alanındaysa yardımcı ol.</li><li>Gerekirse moderasyon ekibine bildir.</li></ul>`},
{id:"izin",title:"🔒 İzinler",heading:"🔒 Towny İzinleri",content:`<p>Towny izinlerinde oyuncular farklı gruplara ayrılabilir.</p><ul><li>R — Resident</li><li>N — Nation</li><li>A — Ally</li><li>O — Outsider</li></ul><h3>Yaygın izinler</h3><ul><li>Build</li><li>Destroy</li><li>Switch</li><li>Item Use</li></ul>`},
{id:"ihlal",title:"⚠️ Oyuncu İhlalleri",heading:"⚠️ Oyuncu İhlalleri",content:`<p>Rehber bir kural ihlali gördüğünde öncelikle olayın ne olduğunu anlamalıdır.</p><ul><li>Olayı değerlendir.</li><li>Kanıt varsa sakla.</li><li>Yetkin varsa gerekli işlemi uygula.</li><li>Yetkin yoksa yetkiliye bildir.</li></ul>`},
{id:"yetkiler",title:"👮 Rehber Yetkileri",heading:"👮 Rehber Yetkileri ve Mute Süreleri",content:`<p>Uygulama yapmadan önce olayın hangi ihlal kapsamında olduğunu doğru şekilde belirle.</p><table><tr><th>İhlal</th><th>Mute Süresi</th></tr><tr><td>Spam</td><td>10 dakika</td></tr><tr><td>Normal küfür – kısaltma</td><td>1–2 saat</td></tr><tr><td>Normal küfür – uzun küfür</td><td>3–5 saat</td></tr><tr><td>Ailevi küfür</td><td>En az 12 saat, en fazla 1 gün</td></tr><tr><td>Hakaret</td><td>1–2 saat</td></tr><tr><td>Reklam</td><td>Sonradan eklenecek</td></tr></table><h3>Mute komutu</h3><div class="command">./mute isim süre sebebi</div><p>Örnek: <code>./mute Oyuncu 2saat Küfür</code></p>`},
{id:"yetkili",title:"👮 Yetkiliye Aktarma",heading:"👮 Yetkiliye Aktarma",content:`<p>Rehberin yetkisini aşan durumlarda olay mutlaka ilgili yetkili ekibe aktarılmalıdır.</p><h3>Özellikle aktarılması gereken durumlar:</h3><ul><li>Hile şüphesi</li><li>Dupe / exploit</li><li>Büyük çaplı grief</li><li>Yetki istismarı</li><li>Sunucu ekonomisini etkileyen sorunlar</li><li>Büyük oyuncu anlaşmazlıkları</li></ul>`}
];

let sections = JSON.parse(localStorage.getItem("townyGuideSections") || "null") || defaultSections;

function save(){localStorage.setItem("townyGuideSections",JSON.stringify(sections));}
function render(){
const menu=document.getElementById("menu"), site=document.getElementById("site");
menu.innerHTML=""; site.innerHTML="";
sections.forEach((s,i)=>{
const b=document.createElement("button"); b.textContent=s.title; b.onclick=()=>showPage(s.id,b); if(i===0)b.classList.add("active"); menu.appendChild(b);
const sec=document.createElement("section"); sec.id=s.id; sec.className="section"; sec.style.display=i===0?"block":"none";
sec.innerHTML=`<div class="card"><h2>${s.heading}</h2>${s.content}</div>`; site.appendChild(sec);
});
}
function showPage(id,button){
document.getElementById("adminPanel").style.display="none"; document.getElementById("site").style.display="block";
document.querySelectorAll(".section").forEach(x=>x.style.display="none");
const target=document.getElementById(id); if(target)target.style.display="block";
document.querySelectorAll(".menu button").forEach(x=>x.classList.remove("active")); button.classList.add("active");
}
function showAdminPanelUnlocked(){document.getElementById("site").style.display="none";document.getElementById("adminPanel").style.display="block";document.querySelectorAll(".menu button").forEach(x=>x.classList.remove("active"));renderAdmin();}
function closeAdmin(){render();document.getElementById("adminPanel").style.display="none";document.getElementById("site").style.display="block";document.querySelector(".menu button")?.classList.add("active");document.querySelectorAll(".section").forEach((x,i)=>x.style.display=i===0?"block":"none");}
function renderAdmin(){
const list=document.getElementById("sectionList"); list.innerHTML="";
sections.forEach((s,i)=>{
const row=document.createElement("div");row.className="section-row";
row.innerHTML=`<span>${s.title}</span><div><button class="action" onclick="editSection(${i})">✏️ Düzenle</button> <button class="action danger" onclick="deleteSection(${i})">🗑️ Sil</button></div>`;
list.appendChild(row);
});
}
function addSection(){
const title=document.getElementById("newTitle").value.trim(), content=document.getElementById("newContent").value.trim();
if(!title||!content){alert("Bölüm adı ve içerik boş bırakılamaz.");return}
sections.push({id:"custom-"+Date.now(),title,heading:title,content:`<p>${escapeHtml(content).replace(/\n/g,"<br>")}</p>`});save();
document.getElementById("newTitle").value="";document.getElementById("newContent").value="";render();renderAdmin();alert("Bölüm eklendi.");
}
function editSection(i){
const s=sections[i], title=prompt("Bölüm adı:",s.title); if(title===null)return;
const content=prompt("İçerik (düz metin):",stripHtml(s.content)); if(content===null)return;
s.title=title.trim()||s.title;s.heading=s.title;s.content=`<p>${escapeHtml(content).replace(/\n/g,"<br>")}</p>`;save();render();renderAdmin();alert("Bölüm güncellendi.");
}
function deleteSection(i){
if(sections.length<=1){alert("En az bir bölüm kalmalı.");return}
if(confirm("Bu bölümü silmek istediğine emin misin?")){sections.splice(i,1);save();render();renderAdmin();}
}
function resetData(){
if(confirm("Tüm yaptığın değişiklikler silinip ilk haline dönülsün mü?")){sections=JSON.parse(JSON.stringify(defaultSections));save();render();renderAdmin();alert("İlk hale döndürüldü.");}
}
function stripHtml(x){const d=document.createElement("div");d.innerHTML=x;return d.innerText}
function escapeHtml(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>



</body>
</html>
